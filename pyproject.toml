[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmap-skill"
version = "0.4.5"
description = "Model-independent, atlas-grounded mouse brain schematics with spatial audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "contourpy>=1.2,<2",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
preview = ["cairosvg>=2.7,<3", "pillow>=10,<13"]

[project.scripts]
brainmap = "brainmap_skill.atlas_schematic:cli"
brainmap-drawings = "brainmap_skill.atlas_drawings:cli"
brainmap-preview = "brainmap_skill.preview:cli"
brainmap-illustrate = "brainmap_skill.illustration:cli"
brainmap-library = "brainmap_skill.template_library:cli"

[tool.setuptools]
packages = ["brainmap_skill"]
package-dir = {brainmap_skill = "scripts"}

[tool.setuptools.package-data]
brainmap_skill = ["request.schema.json", "assets/*.svg", "assets/section-library/*.json", "assets/section-library/*.svg", "assets/section-library/*/*.svg", "assets/section-library/*/*.json"]
